<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>potapenko.dev</title>

  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/script.js" defer></script>
</head>
<body class="page-certificates">

  <div id="header-placeholder"></div>

<main>
  <h2 class="image-text-title">Certificates</h2>

  <ol class="certificate-gallery" aria-label="Certificates">
    <li class="certificate-gallery__item">
      <a
        class="certificate-card colorful-border"
        href="/Certificates/University%20Transcript%20-%20Spokane%20Falls%20Community%20College%20%281%29.jpg%20%283387%C3%972396%29.pdf"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Spokane Falls Community College AA Degree"
      >
        <img
          src="/images/certificates/university-transcript-spokane-falls-community-college.png"
          alt="Spokane Falls Community College AA Degree"
          class="certificate-card__img"
        >
        <span class="certificate-card__title">Spokane Falls Community College AA Degree</span>
      </a>
    </li>

    <li class="certificate-gallery__item">
      <a
        class="certificate-card colorful-border"
        href="/Certificates/Javascript%20Intro%20Course%20Certification.pdf"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open JavaScript Intro Course Certification"
      >
        <img
          src="/images/certificates/javascript-intro-course-real.png"
          alt="JavaScript Intro Course Certification"
          class="certificate-card__img"
        >
        <span class="certificate-card__title">JavaScript Intro Course Certification</span>
      </a>
    </li>

    <li class="certificate-gallery__item">
      <a
        class="certificate-card colorful-border"
        href="/Certificates/Web%20Scraping%20certificate.pdf"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Web Scraping Certificate"
      >
        <img
          src="/images/certificates/web-scraping-certificate.png"
          alt="Web Scraping Certificate"
          class="certificate-card__img"
        >
        <span class="certificate-card__title">Web Scraping Certificate</span>
      </a>
    </li>
  </ol>
</main>

  <div id="footer-placeholder"></div>
  <script src="/assets/js/include.js"></script>
</body>
</html>
